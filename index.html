<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muat & Terima Barang</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="logo-favicon.png">
<link rel="apple-touch-icon" href="logo-192.png">
<meta name="theme-color" content="#1D4E89">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
<style>
  body{font-family:Arial,sans-serif;background:#F3F4F6;margin:0;padding:12px;font-size:15px;color:#14181F}
  h1{font-size:17px;margin:4px 0 10px}
  nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  nav button{padding:10px 14px;border:0;border-radius:8px;background:#1D4E89;color:#fff;font-size:14px;font-weight:bold;white-space:nowrap;opacity:.75}
  nav button.on{background:#F59E0B;color:#14181F;opacity:1}
  .tab{display:none}.tab.on{display:block}
  .card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}
  .bad{color:#B91C1C;font-weight:bold}.ok{color:#157F3C;font-weight:bold}
  input,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;font-size:15px;border:1px solid #ccc;border-radius:8px}
  label{font-size:12px;color:#5B6472;font-weight:bold;text-transform:uppercase}
  .btn{display:block;width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#1D4E89;color:#fff;font-size:15px;font-weight:bold}
  .btn:disabled{opacity:.5}
  .btn.g{background:#157F3C}.btn.o{background:#fff;color:#1D4E89;border:1px solid #1D4E89}
  .r{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
  .r b{font-family:monospace}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #login{position:fixed;inset:0;background:#F3F4F6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:99}
  #login .logo-besar{width:180px;height:180px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0002;margin-bottom:12px}
  #login h2{font-size:18px;margin:0 0 16px;color:#1D4E89}
  #login input{max-width:260px;text-align:center;font-size:22px;letter-spacing:6px}
  #login .btn{max-width:260px;width:100%}
</style>
</head>
<body>

<div id="login">
  <img src="logo-192.png" alt="Logo STP" class="logo-besar">
  <h2>* STP *</h2>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" maxlength="8"
         onkeydown="if(event.key==='Enter')masukPin()">
  <button class="btn" onclick="masukPin()">MASUK</button>
  <div id="login_msg" class="bad" style="margin-top:10px"></div>
</div>

<h1>MUAT & TERIMA BARANG</h1>
<nav>
  <button id="nav_muat" onclick="tab('muat')">Muat Barang</button>
  <button id="nav_terima" onclick="tab('terima')">Terima Barang</button>
  <button class="btn o" onclick="location.reload()">Keluar</button>
</nav>

<!-- MUAT BARANG -->
<section id="muat" class="tab">
  <div class="card">
    <div class="row2">
      <div><label>Tanggal</label><input id="mTgl" type="date"></div>
      <div><label>Shift</label>
        <select id="mShift"><option value="">- pilih -</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      </div>
    </div>
    <label>No. Palet (FG)</label>
    <input id="mPalet" placeholder="contoh: FG-26/11/001" onkeydown="if(event.key==='Enter')mCari()">
    <button class="btn" onclick="mCari()">CARI PALET</button>
    <div id="mInfo" class="card" style="display:none">
      <div class="r"><span>No. Palet</span><b id="miPalet">-</b></div>
      <div class="r"><span>Produk</span><b id="miProduk">-</b></div>
      <div class="r"><span>TF</span><b id="miTf">-</b></div>
      <div class="r"><span>Qty produksi</span><b id="miQty">-</b></div>
      <div class="r"><span>Sisa</span><b id="miSisa">-</b></div>
      <div class="r"><span>Diproduksi</span><b id="miProd">-</b></div>
    </div>
    <div id="mForm" style="display:none">
      <label>Qty muat (Box)</label>
      <input id="mQty" type="number" step="1" inputmode="numeric">
      <label>Nama Muat</label>
      <input id="mNama" placeholder="nama petugas muat">
      <label>Tujuan</label>
      <input id="mTujuan" placeholder="opsional">
      <label>Keterangan</label>
      <input id="mKet" placeholder="opsional">
      <button class="btn g" id="mSave" onclick="mSimpan()">Simpan Muat</button>
    </div>
    <button class="btn o" onclick="mKosongkan()">Kosongkan Form</button>
    <div id="mMsg" style="margin-top:8px;font-size:13px"></div>
  </div>
</section>

<!-- TERIMA BARANG -->
<section id="terima" class="tab">
  <div class="card">
    <div class="bad">Menu Terima Barang belum dilengkapi. Kirim kode terima dari apk lama.</div>
  </div>
</section>

<script>
var URL_EXEC = 'https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var KEY = '';
var MENU_USER = [];
var mItem = null;

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hariIni() { var d = new Date(), z = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function jamHM() { var n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }
function fmtN(n) { return Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 }); }

function api(params) {
  var q = new URLSearchParams(Object.assign({ k: KEY }, params));
  return fetch(URL_EXEC + '?' + q.toString()).then(function (r) { return r.json(); });
}

/* ===== LOGIN ===== */

function masukPin() {
  var p = $('pin').value.trim();
  if (!p) { $('login_msg').textContent = 'Masukkan PIN'; return; }
  KEY = p;
  api({ action: 'login' }).then(function (r) {
    if (!r.ok) { KEY = ''; $('login_msg').textContent = r.error || 'PIN salah'; return; }
    MENU_USER = r.menu;
    $('nav_muat').style.display = MENU_USER.indexOf('muat') >= 0 ? '' : 'none';
    $('nav_terima').style.display = MENU_USER.indexOf('terima') >= 0 ? '' : 'none';
    $('login').style.display = 'none';
    $('pin').value = '';
    $('login_msg').textContent = '';
    tab(MENU_USER.indexOf('muat') >= 0 ? 'muat' : 'terima');
  }).catch(function (e) { KEY = ''; $('login_msg').textContent = 'Gagal: ' + e.message; });
}

function tab(id) {
  document.querySelectorAll('.tab').forEach(function (s) { s.classList.toggle('on', s.id === id); });
  document.querySelectorAll('nav button[id^="nav_"]').forEach(function (b) { b.classList.toggle('on', b.id === 'nav_' + id); });
  if (id === 'muat' && !$('mTgl').value) $('mTgl').value = hariIni();
}

/* ===== MUAT BARANG ===== */

function mMsg(t, c) { $('mMsg').textContent = t; $('mMsg').className = c || ''; }

function mCari() {
  var palet = $('mPalet').value.trim();
  if (!palet) { mMsg('No. Palet belum diisi', 'bad'); return; }
  mMsg('Mencari...', '');
  api({ action: 'muatCari', palet: palet }).then(function (res) {
    if (!res.ok) {
      mItem = null;
      $('mInfo').style.display = 'none';
      $('mForm').style.display = 'none';
      mMsg(res.error || 'Palet tidak ditemukan', 'bad');
      return;
    }
    mItem = res.item;
    $('miPalet').textContent = mItem.palet;
    $('miProduk').textContent = mItem.namaProduk;
    $('miTf').textContent = mItem.tf;
    $('miQty').textContent = fmtN(mItem.qty) + ' Box';
    $('miSisa').textContent = fmtN(mItem.sisa) + ' Box';
    $('miProd').textContent = mItem.tglProduksi + ' ' + mItem.jamProduksi + ' | Shift ' + mItem.shiftProduksi + ' | ' + mItem.namaProduksi;
    $('mInfo').style.display = 'block';
    $('mForm').style.display = 'block';
    $('mQty').max = mItem.sisa;
    $('mQty').value = '';
    $('mSave').disabled = false;
    mMsg('Palet ditemukan. Isi qty muat lalu Simpan.', 'ok');
  }).catch(function (e) { mMsg('Gagal mencari: ' + e.message, 'bad'); });
}

function mSimpan() {
  var tgl = $('mTgl').value, shift = $('mShift').value;
  var qty = parseFloat($('mQty').value), nama = $('mNama').value.trim();
  if (!tgl) { mMsg('Tanggal belum diisi', 'bad'); return; }
  if (!shift) { mMsg('Shift belum dipilih', 'bad'); return; }
  if (!mItem) { mMsg('Cari palet dulu', 'bad'); return; }
  if (isNaN(qty) || qty <= 0) { mMsg('Qty muat belum valid', 'bad'); return; }
  if (qty > mItem.sisa) { mMsg('Qty melebihi sisa palet (' + fmtN(mItem.sisa) + ')', 'bad'); return; }
  if (!nama) { mMsg('Nama muat belum diisi', 'bad'); return; }

  var data = {
    _app: 'muat', tanggal: tgl, jam: jamHM(), shift: shift,
    palet: mItem.palet, qty: qty, namaMuat: nama,
    tujuan: $('mTujuan').value.trim(), keterangan: $('mKet').value.trim()
  };
  $('mSave').disabled = true;
  mMsg('Menyimpan...', '');
  api({ action: 'save', payload: JSON.stringify(data) }).then(function (res) {
    if (res.ok) {
      mMsg('✅ Tersimpan. Sisa palet: ' + fmtN(res.sisa) + ' Box', 'ok');
      $('mQty').value = '';
      $('mSave').disabled = false;
      mCari();
    } else {
      $('mSave').disabled = false;
      mMsg('❌ Gagal: ' + (res.error || 'tidak diketahui'), 'bad');
    }
  }).catch(function (e) { $('mSave').disabled = false; mMsg('❌ Gagal: ' + e.message, 'bad'); });
}

function mKosongkan() {
  mItem = null;
  ['mPalet', 'mQty', 'mNama', 'mTujuan', 'mKet', 'mShift'].forEach(function (id) { $(id).value = ''; });
  $('mInfo').style.display = 'none';
  $('mForm').style.display = 'none';
  $('mTgl').value = hariIni();
  mMsg('Form dikosongkan.', 'ok');
}
</script>
</body>
</html>
